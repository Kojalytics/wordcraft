name: Kojalytics update from ArtCraft

# Once a month (the first Monday): if ArtCraft released a newer version of this app, merge it, apply
# the Kojalytics branding again (brand/sync-upstream.sh), check it with the branding guard and the
# tests, then build, sign and notarize the DMG and put it in a DRAFT release; kojalytics-windows.yml
# then adds the (unsigned) Windows MSI to that draft. Customers get nothing until the draft is
# published with kojalytics-publish.yml, which signs the Windows build; an issue in this repo says
# when one is waiting. ArtCraft releases every few days, so monthly keeps the number of Windows
# signatures (paid per signature) and updates down.
# A blocked run (guard, merge or tests) fails, and GitHub emails about the failed run.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Only build and draft the current version (no merge from ArtCraft)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: koja-sync
  cancel-in-progress: false

jobs:
  # GitHub's cron can't say "first Monday of the month": it starts every Monday, and only the first
  # one in a month goes on. Started by hand, it always goes on.
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.day.outputs.go }}
    steps:
      - id: day
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$(date -u +%-d)" -le 7 ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "not the first Monday of the month: nothing to do"; fi

  sync:
    needs: when
    if: needs.when.outputs.go == '1'
    runs-on: macos-15
    timeout-minutes: 300
    outputs:
      build: ${{ steps.sync.outputs.build }}
      sha: ${{ steps.sync.outputs.sha }}
    env:
      APP_ID: ${{ vars.KOJA_APP_ID }}
      APP_NAME: ${{ vars.KOJA_APP_NAME }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ vars.KOJA_APP_ID }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kojalytics/koja-brand
          path: brand

      - name: Tools
        run: |
          rustup update stable && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          brew install resvg
          python3 -m pip install --break-system-packages fonttools pillow
          git config --global user.name "Kojalytics"
          git config --global user.email "noreply@kojalytics.com"

      - name: Merge ArtCraft's newest release and rebrand
        id: sync
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          set -o pipefail
          if [ "$BUILD_ONLY" = "true" ]; then echo "build only: no merge" > sync.log
          else bash brand/sync-upstream.sh "$APP_ID" "$APP_NAME" | tee sync.log; fi
          if grep -q '^READY:' sync.log; then echo "ready=1" >> "$GITHUB_OUTPUT"; fi
          # Build when this version has no release yet (also after a run that stopped before it).
          cd "$APP_ID"
          version=$(git show "$(git rev-parse --verify -q koja-sync || echo HEAD)":Cargo.toml | grep -m1 -E '^version = "' | cut -d'"' -f2)
          if ! gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "build=1" >> "$GITHUB_OUTPUT"; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push the update
        if: steps.sync.outputs.ready == '1'
        working-directory: ${{ vars.KOJA_APP_ID }}
        run: git push origin koja-sync:main

      - name: Signing certificate
        if: steps.sync.outputs.build == '1'
        working-directory: ${{ vars.KOJA_APP_ID }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash packaging/macos/import-cert.sh

      - name: Build, sign and notarize
        if: steps.sync.outputs.build == '1'
        working-directory: ${{ vars.KOJA_APP_ID }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/macos/package.sh --arch universal

      - name: Draft release and notice
        if: steps.sync.outputs.build == '1'
        working-directory: ${{ vars.KOJA_APP_ID }}/dist/release
        run: |
          dmg=$(ls *-macos-universal.dmg | head -1)
          version=$(printf '%s' "$dmg" | sed -E 's/^.*-([0-9][0-9.]*)-macos-universal\.dmg$/\1/')
          for i in 1 2 3 4 5 6; do xcrun stapler validate "$dmg" && break; [ $i = 6 ] && echo "::warning::stapler validate kept failing (Apple network); package.sh already stapled"; sleep $((i * 20)); done
          shasum -a 256 "$dmg" > SHA256SUMS.txt
          gh release create "v$version" "$dmg" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --draft --target "$(git rev-parse HEAD)" \
            --title "$APP_NAME $version" \
            --notes "Signed and notarized macOS build (universal: Apple Silicon and Intel). Published by Kojalytics."
          gh issue create -R "$GITHUB_REPOSITORY" --title "$APP_NAME $version is ready to publish" --body "A new $APP_NAME build passed the branding guard and was signed and notarized.

          Wait for the Windows build (workflow \"Kojalytics release (Windows)\") to add its MSI and check the draft: https://github.com/$GITHUB_REPOSITORY/releases
          Then publish it with Actions › Kojalytics publish › Run workflow. That signs the Windows build and publishes the draft; customers get the update through the Kojalytics Launcher right after."

  windows:
    needs: sync
    if: needs.sync.outputs.build == '1'
    uses: ./.github/workflows/kojalytics-windows.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
      release: true
    secrets: inherit
